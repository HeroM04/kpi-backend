spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Bật OSIV (mặc định Spring) để các controller KPI map entity->DTO ngoài transaction
    # không bị LazyInitializationException (trả 400). SalePro vẫn an toàn vì mapper chạy trong @Transactional.
    open-in-view: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8088

app:
  jwt:
    # QUAN TRỌNG: chuỗi bí mật ký token đăng nhập.
    # Giá trị mặc định dưới đây CHỈ dùng cho máy dev và ĐÃ BỊ LỘ trên Git —
    # production BẮT BUỘC đặt biến môi trường JWT_SECRET (chuỗi ngẫu nhiên >= 32 ký tự),
    # nếu không kẻ xấu có thể tự tạo token giả mạo bất kỳ tài khoản nào.
    secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-production-32chars}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  rekognition:
    enabled: true

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY:CHANGE_ME_IN_PROD}
    secret-key: ${AWS_SECRET_KEY:CHANGE_ME_IN_PROD}
    region: ${AWS_REGION:ap-southeast-1}
    bucket-name: ${AWS_BUCKET_NAME:trilong-kpi-uploads}
    base-url: ${AWS_S3_BASE_URL:https://trilong-kpi-uploads.s3.ap-southeast-1.amazonaws.com}
  accessKeyId: ${AWS_ACCESS_KEY:CHANGE_ME_IN_PROD}
  secretKey: ${AWS_SECRET_KEY:CHANGE_ME_IN_PROD}
  region: ap-southeast-1
  rekognition:
    similarity-threshold: 60.0

# Google Gemini — dùng cho chức năng AI chấm điểm bài đăng.
# KHÔNG ghi key trực tiếp vào đây. Đặt qua biến môi trường GEMINI_API_KEY
# (local: file .env / biến hệ thống; production: Environment trên Render).
gemini:
  api-key: ${GEMINI_API_KEY:}
  # Alias "-latest" để Google tự trỏ sang bản Flash mới nhất, tránh lỗi model bị khai tử
  model: ${GEMINI_MODEL:gemini-flash-latest}

# Cloudinary — lưu ảnh upload.
# KHÔNG ghi api-secret trực tiếp vào đây (file này được commit lên Git).
# Đặt qua biến môi trường: local dùng file .env, production dùng Environment trên Render.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
