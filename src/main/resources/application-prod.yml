spring:
  datasource:
    # Trên Render, có thể truyền biến DATABASE_URL từ tab Environment
    url: ${DATABASE_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      # Supabase Free đi qua pooler (Supavisor, session mode, cổng 5432) — trần
      # kết nối đồng thời thấp. 5 kết nối đủ cho 40 luồng Tomcat của một
      # container nhỏ; nhiều hơn chỉ xếp hàng ở pooler chứ không nhanh hơn.
      maximum-pool-size: 5
      # Rỗi thì trả kết nối về, không giữ mở thường trực. Với Neon trước đây,
      # 10 kết nối mở 24/7 là lý do DB không bao giờ được ngủ và hết 190 giờ
      # compute vào ngày 18 hằng tháng. Supabase không tính giờ, nhưng thói
      # quen này vẫn đúng: không chiếm chỗ ở pooler khi không dùng.
      minimum-idle: 1
      idle-timeout: 120000
      max-lifetime: 600000
      connection-timeout: 15000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: update
    # Tắt log SQL để đỡ tốn bộ nhớ và log file không bị phình to
    show-sql: false 
    properties:
      hibernate:
        format_sql: false
        hbm2ddl.create_namespaces: true

server:
  tomcat:
    threads:
      # Mặc định 200 luồng là cho máy nhiều CPU. Container 0.1–0.5 CPU chạy 200
      # luồng chỉ tốn RAM và tranh nhau CPU; 40 luồng đã dư cho 200 người chấm
      # công rải trong 15 phút (~0,3 yêu cầu/giây). Quá số này thì xếp hàng chờ
      # (accept-count) thay vì đẩy container vào ngưỡng hết bộ nhớ.
      max: 40
      min-spare: 4
    accept-count: 200

app:
  storage:
    type: s3 # Trên prod sẽ tự động lưu ảnh lên S3 (hoặc Cloudinary)

